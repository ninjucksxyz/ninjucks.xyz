[package]
name = "mock-router"
version = "0.1.0"
edition = "2021"
description = "Test fixture: stand-in DEX router for ninjucks testnet validation (NOT part of the aggregator)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
overflow-checks = true
panic = "abort"
codegen-units = 1

[dependencies]
cosmwasm-std = { version = "2.1", features = ["stargate"] }
cosmwasm-schema = "2.1"
