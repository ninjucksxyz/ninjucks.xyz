[package]
name = "ninjucks"
version = "0.1.0"
edition = "2021"
description = "Unified swap aggregator for Injective"
license = "Apache-2.0"
repository = "https://github.com/<org>/ninjucks"

exclude = ["contract.wasm", "hash.txt"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# use library feature to disable all instantiate/execute/query exports
library = []

[profile.release]
opt-level = "z"
debug = false
rpath = false
lto = true
overflow-checks = true
panic = "abort"
codegen-units = 1
incremental = false

[dependencies]
cosmwasm-std = { version = "2.1", features = ["stargate"] }
cosmwasm-schema = "2.1"
cw-storage-plus = "2.0"
cw2 = "2.0"
thiserror = "1.0"

[dev-dependencies]
cw-multi-test = "2.1"
